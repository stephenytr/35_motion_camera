[workspace]
resolver = "2"
members = ["logic", "firmware"]
# Host-side commands (cargo test / clippy / fmt at repo root) build only `logic`.
# The firmware crate requires the espup xtensa toolchain; build it from firmware/
# (its .cargo/config.toml sets the target) or: cargo build -p firmware --target xtensa-esp32s3-none-elf
default-members = ["logic"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
logic = { path = "logic" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
